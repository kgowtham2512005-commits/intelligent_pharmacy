{% extends 'base.html' %}

{% block title %}Pharmacy Admin Login — RuralCare AI{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-8">
      <div class="card card-glass p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="icon-box icon-admin mx-auto mb-3">
            <i class="bi bi-shield-lock"></i>
          </div>
          <h2 class="fw-bold text-dark">Pharmacy Admin Login</h2>
          <p class="text-muted">Sign in to manage your medical shop inventory and dashboard.</p>
        </div>

        <form action="{{ url_for('admin_bp.login') }}" method="POST" id="loginForm">
          <div class="mb-3">
            <label for="username" class="form-label fw-semibold">Username / Email</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
              <input type="text" class="form-control" id="username" name="username" placeholder="e.g. sri741815@gmail.com" value="{{ username or '' }}" required autofocus>
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
              <button class="btn btn-outline-secondary toggle-password-btn" type="button" data-target="password">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary-custom py-3 rounded-pill fw-bold text-uppercase" style="letter-spacing: 0.5px;">
              <i class="bi bi-box-arrow-in-right me-2"></i> Log In to Dashboard
            </button>
          </div>

          <div class="text-center mt-4">
            <p class="text-muted mb-0">Don't have an admin account yet? <a href="{{ url_for('admin_bp.register') }}" class="text-teal fw-bold">Register your Pharmacy</a></p>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
