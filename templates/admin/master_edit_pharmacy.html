{% extends 'base.html' %}

{% block title %}Master Edit Pharmacy — {{ pharmacy.shop_name }}{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 800px;">

  <div class="d-flex align-items-center justify-content-between mb-4">
    <a href="{{ url_for('admin_bp.master_dashboard') }}" class="btn btn-sm btn-outline-secondary rounded-pill">
      <i class="bi bi-arrow-left"></i> Back to Master Portal
    </a>
    <span class="badge bg-primary bg-opacity-10 text-primary border border-primary px-3 py-2 rounded-pill">
      Pharmacy ID #{{ pharmacy.pharmacy_id }}
    </span>
  </div>

  <div class="card card-glass p-4 p-md-5 border-top border-4 border-teal" style="border-color: #0d9488 !important;">
    <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
      <div class="brand-icon bg-teal text-white fs-3" style="width: 48px; height: 48px; border-radius: 14px; background-color: #0d9488;">
        <i class="bi bi-shop"></i>
      </div>
      <div>
        <h3 class="fw-bold mb-0 text-dark">Edit Pharmacy Details</h3>
        <p class="text-muted small mb-0">Master edit control for <strong>{{ pharmacy.shop_name }}</strong></p>
      </div>
    </div>

    <form method="POST" action="{{ url_for('admin_bp.master_edit_pharmacy', pharmacy_id=pharmacy.pharmacy_id) }}">
      <div class="row g-3">

        <div class="col-md-6">
          <label class="form-label fw-bold small text-dark">Shop / Pharmacy Name <span class="text-danger">*</span></label>
          <input type="text" name="shop_name" class="form-control" value="{{ pharmacy.shop_name }}" required>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-bold small text-dark">Owner Name <span class="text-danger">*</span></label>
          <input type="text" name="owner_name" class="form-control" value="{{ pharmacy.owner_name }}" required>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-bold small text-dark">Phone Number <span class="text-danger">*</span></label>
          <input type="tel" name="phone" class="form-control" value="{{ pharmacy.phone }}" required>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-bold small text-dark">Distance from Center (km)</label>
          <input type="number" step="0.01" name="distance_km" class="form-control" value="{{ pharmacy.distance_km if pharmacy.distance_km is not none else '' }}" placeholder="e.g. 1.2">
        </div>

        <div class="col-12">
          <label class="form-label fw-bold small text-dark">Registered Address <span class="text-danger">*</span></label>
          <textarea name="address" rows="3" class="form-control" required>{{ pharmacy.address }}</textarea>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-bold small text-dark">Latitude</label>
          <input type="number" step="0.00000001" name="latitude" class="form-control" value="{{ pharmacy.latitude if pharmacy.latitude is not none else '' }}" placeholder="10.9025">
        </div>

        <div class="col-md-6">
          <label class="form-label fw-bold small text-dark">Longitude</label>
          <input type="number" step="0.00000001" name="longitude" class="form-control" value="{{ pharmacy.longitude if pharmacy.longitude is not none else '' }}" placeholder="76.9950">
        </div>

        <div class="col-12 mt-4 d-flex justify-content-between align-items-center">
          <a href="{{ url_for('admin_bp.master_dashboard') }}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
          <button type="submit" class="btn btn-teal text-white rounded-pill px-5 shadow-sm" style="background-color: #0d9488;">
            <i class="bi bi-check2-circle me-1"></i> Save Changes
          </button>
        </div>

      </div>
    </form>
  </div>

</div>
{% endblock %}
