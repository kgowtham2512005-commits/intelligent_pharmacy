{% extends 'base.html' %}

{% block title %}404 - Page Not Found — RuralCare AI{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="card card-glass mx-auto p-5" style="max-width: 600px;">
    <div class="icon-box icon-customer mx-auto mb-3 text-warning bg-warning bg-opacity-10">
      <i class="bi bi-exclamation-triangle-fill fs-2"></i>
    </div>
    <h1 class="display-4 fw-bold text-dark mb-2">404</h1>
    <h3 class="fw-bold text-secondary mb-3">Page Not Found</h3>
    <p class="text-muted mb-4">
      The page or medicine details you are looking for could not be found or may have been moved.
    </p>

    <form action="{{ url_for('user_bp.search_page') }}" method="GET" class="mb-4">
      <div class="input-group">
        <input type="text" name="q" class="form-control" placeholder="Search for a medicine..." required>
        <button type="submit" class="btn btn-primary-custom">Search</button>
      </div>
    </form>

    <div>
      <a href="{{ url_for('user_bp.landing') }}" class="btn btn-outline-custom rounded-pill px-4">
        <i class="bi bi-house-door me-1"></i> Return to Homepage
      </a>
    </div>
  </div>
</div>
{% endblock %}
